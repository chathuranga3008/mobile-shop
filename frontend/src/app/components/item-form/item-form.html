<div class="form-container">

  <!-- Form Header -->
  <div class="form-heading">
    <h2>{{ isEditMode ? 'Edit Item' : 'Add New Item' }}</h2>

    <button
      (click)="closeForm.emit()"
      class="close-form-button"
      type="button"
    >
      ✕ Close
    </button>
  </div>

  <!-- Item Form -->
  <form #itemForm="ngForm" (ngSubmit)="saveItem()">

    <div class="form-group">
      <label>SKU</label>
      <input
        [(ngModel)]="item.sku"
        name="sku"
        placeholder="e.g. PHN-SAM-001"
        required
        type="text"
      />
    </div>

    <div class="form-group">
      <label>Item Name</label>
      <input
        [(ngModel)]="item.name"
        name="name"
        placeholder="Enter item name"
        required
        type="text"
      />
    </div>

    <div class="form-group">
      <label>Brand</label>
      <input
        [(ngModel)]="item.brand"
        name="brand"
        placeholder="Enter brand"
        required
        type="text"
      />
    </div>

    <div class="form-group">
      <label>Category</label>
      <input
        [(ngModel)]="item.category"
        name="category"
        placeholder="e.g. Smartphone"
        required
        type="text"
      />
    </div>

    <div class="form-group">
      <label>Price</label>
      <input
        [(ngModel)]="item.price"
        min="0.01"
        name="price"
        required
        type="number"
      />
    </div>

    <div class="form-group">
      <label>Quantity</label>
      <input
        [(ngModel)]="item.quantity"
        min="0"
        name="quantity"
        required
        type="number"
      />
    </div>

    <div class="form-group">
      <label>Low Stock Threshold</label>
      <input
        [(ngModel)]="item.lowStockThreshold"
        min="0"
        name="lowStockThreshold"
        required
        type="number"
      />
    </div>

    <button [disabled]="itemForm.invalid" type="submit">
      {{ isEditMode ? 'Update Item' : 'Save Item' }}
    </button>

  </form>

  <!-- Success Message -->
  <p *ngIf="successMessage" class="success">
    {{ successMessage }}
  </p>

  <!-- Error Message -->
  <p *ngIf="errorMessage" class="error">
    {{ errorMessage }}
  </p>

</div>
