<div class="form-container">
  <h2>Add New Item</h2>

  <form (ngSubmit)="saveItem()" #itemForm="ngForm">

    <div class="form-group">
      <label>SKU</label>
      <input
        type="text"
        name="sku"
        [(ngModel)]="item.sku"
        required
        placeholder="e.g. PHN-SAM-001">
    </div>

    <div class="form-group">
      <label>Item Name</label>
      <input
        type="text"
        name="name"
        [(ngModel)]="item.name"
        required
        placeholder="Enter item name">
    </div>

    <div class="form-group">
      <label>Brand</label>
      <input
        type="text"
        name="brand"
        [(ngModel)]="item.brand"
        required
        placeholder="Enter brand">
    </div>

    <div class="form-group">
      <label>Category</label>
      <input
        type="text"
        name="category"
        [(ngModel)]="item.category"
        required
        placeholder="e.g. Smartphone">
    </div>

    <div class="form-group">
      <label>Price</label>
      <input
        type="number"
        name="price"
        [(ngModel)]="item.price"
        required
        min="0.01">
    </div>

    <div class="form-group">
      <label>Quantity</label>
      <input
        type="number"
        name="quantity"
        [(ngModel)]="item.quantity"
        required
        min="0">
    </div>

    <div class="form-group">
      <label>Low Stock Threshold</label>
      <input
        type="number"
        name="lowStockThreshold"
        [(ngModel)]="item.lowStockThreshold"
        required
        min="0">
    </div>

    <button type="submit" [disabled]="itemForm.invalid">
      Save Item
    </button>

  </form>

  <p class="success" *ngIf="successMessage">
    {{ successMessage }}
  </p>

  <p class="error" *ngIf="errorMessage">
    {{ errorMessage }}
  </p>
</div>
